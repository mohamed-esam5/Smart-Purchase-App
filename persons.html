<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Purchase - إدارة الأشخاص</title>
    
    <link rel="stylesheet" href="css/global.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <i class="fa-solid fa-wallet"></i>
                <span>Smart Purchase</span>
            </div>
            <nav class="nav-links">
               <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> الرئيسية</a>
                <a href="bills.html"><i class="fa-solid fa-file-invoice-dollar"></i> الفواتير</a>
                <a href="payments.html"><i class="fa-solid fa-money-bill-transfer"></i> السداد</a>
                <a href="persons.html" class="active"><i class="fa-solid fa-users"></i> الأشخاص</a>
                <a href="reports.html"><i class="fa-solid fa-magnifying-glass-chart"></i> التقارير</a>
                 <a href="archive.html"><i class="fa-solid fa-box-archive"></i> الأرشيف</a>
            </nav>
            <div class="user-actions">
                <button id="theme-toggle-btn" style="background: none; border: none; color: inherit; font-size: 18px; cursor: pointer; margin-left: 15px;" title="تبديل الوضع">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="logout-btn" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
            </div>
        </div>
    </header>

    <main class="page-container" style="max-width: 1200px; margin: 30px auto; padding: 0 20px;">
        <div class="page-title-box" style="border-bottom: 1px solid var(--border-color);">
            <div>
                <h2 style="color: var(--page-title-color);">إدارة الأشخاص والمقربين</h2>
                <p style="color: var(--text-muted);">أضف الأشخاص لتتمكن من تقسيم الفواتير وحساب مديونية كل فرد بدقة</p>
            </div>
            <button id="open-modal-btn" class="btn-add" style="background: var(--primary-gradient); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; font-family: 'Cairo', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: opacity 0.2s;">
                <i class="fa-solid fa-user-plus"></i> إضافة شخص
            </button>
        </div>

        <div class="table-container" style="background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); overflow-x: auto; border: 1px solid var(--border-color); margin-top: 10px; transition: background 0.3s, border-color 0.3s;">
            <table class="main-table" style="width: 100%; border-collapse: collapse; text-align: right; min-width: 600px;">
                <thead>
                    <tr style="background-color: var(--card-bg-nested); color: var(--text-color); font-weight: 700;">
                        <th style="padding: 15px 20px; border-bottom: 1px solid var(--border-color); color: var(--text-color);">اسم الشخص</th>
                        <th style="padding: 15px 20px; border-bottom: 1px solid var(--border-color); color: var(--text-color);">رقم الهاتف (اختياري)</th>
                        <th style="padding: 15px 20px; border-bottom: 1px solid var(--border-color); color: var(--text-color);">تاريخ الإضافة</th>
                        <th style="padding: 15px 20px; border-bottom: 1px solid var(--border-color); color: var(--text-color);">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="persons-table-body">
                    <tr>
                        <td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px; font-family: 'Cairo';">
                            <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل قائمة الأشخاص...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="bill-modal" class="modal" style="display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center;">
        <div class="modal-content" style="background-color: var(--card-bg); padding: 30px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border-color); transition: background-color 0.3s;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
                <h3 style="color: var(--page-title-color); font-weight: 700; margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-user-plus"></i> إضافة شخص جديد للمنظومة
                </h3>
                <span class="close-modal" style="cursor: pointer; font-size: 28px; font-weight: bold; color: var(--text-muted); line-height: 1;">&times;</span>
            </div>
            
            <form id="person-form">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-color); font-size: 14px;">اسم الشخص بالكامل <span style="color:red;">*</span></label>
                    <input type="text" id="person-name" placeholder="مثال: أحمد محمد" required style="width:100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--card-bg-nested); color: var(--text-color); font-family:'Cairo'; font-size:14px; outline:none; transition: background-color 0.3s, color 0.3s, border-color 0.3s;">
                </div>
                
                <div class="form-group" style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-color); font-size: 14px;">رقم الهاتف (اختياري)</label>
                    <input type="tel" id="person-phone" placeholder="مثال: 01xxxxxxxxx" style="width:100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--card-bg-nested); color: var(--text-color); font-family:'Cairo'; font-size:14px; outline:none; transition: background-color 0.3s, color 0.3s, border-color 0.3s;">
                </div>
                
                <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                    <button type="submit" style="background: var(--primary-gradient); color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-family:'Cairo'; font-weight: 600; cursor: pointer; font-size:14px;">حفظ البيانات</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script type="module" src="js/persons.js"></script>
</body>
</html>
